[package]
name = "jobserver-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Cooperative concurrency gate for Rust, coordinating GNU jobserver and rayon/threads without CPU oversaturation."
repository = "https://github.com/tomet-lang/jobserver-gate"
readme = "README.md"
keywords = ["jobserver", "concurrency", "rayon", "parallel", "multithreading"]
categories = ["concurrency", "development-tools"]
# What catasto manages is for this repository, not for the published crate.
exclude = ["catasto.ctmt", "catasto.lock", ".editorconfig", ".gitattributes"]

[dependencies]
jobserver = "0.1"

[features]
default = []
